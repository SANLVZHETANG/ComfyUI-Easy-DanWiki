<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../web/js/dbtags_autocomplete.css">
<style>
  body{background:#1c1c1c;padding:14px 18px;margin:0;}
  .dv{color:#8cf;font:11px monospace;margin:10px 0 2px;}
  .z2{zoom:2;}
</style></head><body>
<script>
/* fix27 preflight: gtile gains a post_count line (matches runtime DOM order img>zh>en>cnt).
   left grid with counts, right grid without (unindexed member = no t) for height check */
function tile(zh, en, cnt) {
  return '<div class="dbtags-ac-gtile">' +
    '<img alt="" style="height:64px;background:repeating-linear-gradient(45deg,#333,#333 12px,#3a3a3a 12px,#3a3a3a 24px);border-radius:4px;object-fit:cover">' +
    '<span class="dbtags-ac-gtile-zh">' + zh + '</span>' +
    '<span class="dbtags-ac-gtile-en">' + en + '</span>' +
    (cnt != null ? '<span class="dbtags-ac-gtile-cnt" title="' + cnt + ' images">' + cnt + '</span>' : '') +
  '</div>';
}
const withCnt = tile("鞭打", "whipping", "828K") + tile("捆绑调教", "bound_and_gagged", "156K") +
  tile("体罚", "corporal_punishment", "23K") + tile("长鞭", "long_whip", "4.2K");
const noCnt = tile("滚态", "unindexed_member", null) + tile("英文特别长拖到省略号看看", "very_long_english_name", null) + tile("约束姿势", "restraint_pose", "1.1M");
for (const z of ["", " z2"]) {
  const d = document.createElement("div");
  d.innerHTML =
    '<div class="dv">' + (z ? "2x" : "1x") + ' fix27 tile count (left=with cnt, right=no unindexed)</div>' +
    '<div style="display:flex;gap:24px' + '">' +
      '<div class="dbtags-ac-gtiles" style="width:380px' + '">' + withCnt + '</div>' +
      '<div class="dbtags-ac-gtiles" style="width:280px' + '">' + noCnt + '</div>' +
    '</div>';
  d.className = z;
  document.body.appendChild(d);
}
</script>
</body></html>
