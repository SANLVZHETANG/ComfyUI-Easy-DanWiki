<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../web/js/dbtags_autocomplete.css">
<style>
  body{background:#242424;padding:14px;margin:0;display:flex;gap:22px;align-items:flex-start;}
  .dv{color:#8cf;font:11px monospace;margin:0 0 4px;}
  .dbtags-ac-styler-row{display:flex;align-items:center;gap:8px;}
  .dbtags-ac-styler-label{flex:0 0 132px;display:flex;}
  select, input[type=checkbox]{accent-color:#6aa;}
  input:disabled, select:disabled{opacity:.45;}
</style></head><body>
<script>
const lab=(t)=>'<div class="dbtags-ac-styler-label">'+t+'</div>';
const bool=(t,ck,dz)=>'<div class="dbtags-ac-styler-row">'+lab(t)+'<input type="checkbox"'+(ck?" checked":"")+(dz?" disabled":"")+'></div>';
const combo=(t,v,dz)=>'<div class="dbtags-ac-styler-row">'+lab(t)+'<select'+(dz?" disabled":"")+'><option>'+v+'</option></select></div>';
const fold=(master,open)=>'<details class="dbtags-ac-styler-fold"'+(open?" open":"")+'><summary>悬停预览</summary>'+
  '<div class="dbtags-ac-styler-row">'+lab('启用预览卡')+'<input type="checkbox"'+(master?" checked":"")+'></div>'+
  bool("显示预览图",1,!master)+combo("预览图尺寸","小图",!master)+bool("显示文字摘要",1,!master)+'</details>';
const wikicard=(master,foldopen)=>'<div style="width:430px;background:var(--dbtags-ac-bg);border:1px solid var(--dbtags-ac-border);border-radius:8px;padding:10px">'+
  '<div class="dv" style="color:#5a5;font:11px monospace;margin:0 0 8px;">wiki 面板（卡片）</div><div class="dbtags-ac-styler-subgroup">'+
  bool("wiki 正文",1)+fold(master,foldopen)+bool("跳转胶囊",1)+
  '</div></div>';
const d1=document.createElement("div");d1.innerHTML='<div class="dv">总开关开（子项可调）</div>'+wikicard(1,1);document.body.append(d1);
const d2=document.createElement("div");d2.innerHTML='<div class="dv">总开关关（子项全灰）</div>'+wikicard(0,1);document.body.append(d2);
</script>
</body></html>
