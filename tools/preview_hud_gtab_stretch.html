<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../web/js/dbtags_autocomplete.css">
<style>
  body{background:#1c1c1c;padding:14px;margin:0;display:flex;gap:24px;align-items:flex-start;}
  .dv{color:#8cf;font:11px monospace;margin:0 0 4px;}
  /* popup browser mock: fixed 480px like .gbrowser default */
  .gb{position:relative;width:480px;height:600px;}
  .gbright{display:flex;flex-direction:column;width:100%;height:100%;}
  /* hud mock: window-width like the user's screenshot (~695px), no fixed h */
  .hud{position:relative;width:695px;height:600px;}
  .hudright{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:auto;padding:6px 8px 10px;}
  .hudbody{color:var(--dbtags-ac-sub);font-size:12px;line-height:1.5;word-break:break-word;text-indent:2em;padding-bottom:4px;}
  .hudhead,.hudtabs{height:30px;background:var(--dbtags-ac-bg);border-bottom:1px solid var(--dbtags-ac-border);display:flex;align-items:center;gap:8px;padding:0 10px;}
</style></head><body>
<script>
const T=(z,e,c)=>'<div class="dbtags-ac-gtile"><img alt="" style="height:64px;background:repeating-linear-gradient(45deg,#333,#333 12px,#3a3a3a 12px,#3a3a3a 24px);border-radius:4px"><span class="dbtags-ac-gtile-zh">'+z+'</span><span class="dbtags-ac-gtile-en">'+e+'</span><span class="dbtags-ac-gtile-cnt">'+c+'</span></div>';
const sec=(t,en,n,cnt)=>'<div class="dbtags-ac-gsec"><div class="dbtags-ac-gsec-head" style="display:flex;gap:6px;align-items:center"><span class="dbtags-ac-gsec-caret">▾</span><span class="dbtags-ac-gsec-title">'+t+'</span><span class="dbtags-ac-gsec-en">'+en+'</span><span class="dbtags-ac-gsec-count" style="color:#5a5">'+cnt+'</span></div><div class="dbtags-ac-gtiles">'+
  Array.from({length:n},(_,i)=>T("测试名"+i,"test_tag_"+i,(5+i)+"K")).join("")+'</div></div>';
const tools='<div class="dbtags-ac-gtools"><input class="dbtags-ac-gfilter" placeholder="组内过滤(中/英)，如: 裙 / dress"><button class="dbtags-ac-gtoolbtn">收起全部</button><button class="dbtags-ac-gtoolbtn">展开全部</button></div>';
/* A: popup browser context (gb-body is flex column; gscroll flex:1 works) */
const a=document.createElement("div");a.className="gb";
a.innerHTML='<div class="dv">A 弹窗组浏览器 (480px)</div><div class="dbtags-ac-gbrowser" style="position:relative;right:auto;top:auto;height:560px"><div class="dbtags-ac-gb-head" style="height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--dbtags-ac-bg);border-bottom:1px solid var(--dbtags-ac-border)"><span>‹ 全部组</span><b>面部 (face tags)</b><span style="color:#5a5">222</span></div><div class="dbtags-ac-gb-body">'+tools+'<div class="dbtags-ac-gscroll">'+sec("主要","Main",2,"2/2")+sec("情绪","Emotions",14,"14/14")+'</div></div></div>';
document.body.append(a);
/* B: HUD group-tab context (hud-body is a plain block inside hud-scroll) */
const b=document.createElement("div");b.className="hud";
b.innerHTML='<div class="dv">B HUD 组 tab (695px)</div><div class="dbtags-ac-hud" style="position:relative;z-index:auto;max-width:none;max-height:none;height:566px"><div class="hudhead"><b>面部 (face tags)</b><span style="color:#5a5">222</span></div><div class="hudtabs"><span>▣ 面部 ×</span><span>▣ 手势 ×</span></div><div class="hudright"><div class="hudbody">'+tools+'<div class="dbtags-ac-gscroll">'+sec("主要","Main",2,"2/2")+sec("情绪","Emotions",14,"14/14")+'</div></div></div></div>';
document.body.append(b);
</script>
</body></html>
