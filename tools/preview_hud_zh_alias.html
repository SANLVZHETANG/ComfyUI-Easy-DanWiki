<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../web/js/dbtags_autocomplete.css">
<style>
  body{background:#1c1c1c;padding:14px 18px;margin:0;}
  .dv{color:#8cf;font:11px monospace;margin:10px 0 2px;}
  .dbtags-ac-hud{position:static !important;width:340px;}
  .z3{zoom:3;width:auto;}
</style></head><body>
<script>
const N = "自拍", A = "自拍照/手机自拍";
for (let f of ["13px", "16px"]) {
  document.body.appendChild(Object.assign(document.createElement("div"),
    { textContent: "hudFont=" + f + " (css text-bottom live)", style: "color:#f84;font:12px monospace;margin:12px 0 2px;" }));
  const w = document.createElement("div");
  w.className = "dbtags-ac-hud z3";
  w.style.setProperty("--dbtags-ac-font", f);
  w.innerHTML =
    '<div class="dbtags-ac-hud-scroll">' +
      '<div class="dbtags-ac-hud-zh">' + N +
        '<span class="dbtags-ac-hud-zh-alias">' + A + '</span>' +
      '</div>' +
    '</div>';
  document.body.appendChild(w);
}
</script>
</body></html>
