<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../web/js/dbtags_autocomplete.css">
<style>
  body{background:#242424;padding:14px;margin:0;display:flex;gap:24px;align-items:flex-start;}
  .dv{color:#8cf;font:11px monospace;margin:0 0 4px;}
  /* fix33 self-review: both columns 441px hud, LEFT simulates current a27 (72px min,
     64px img via inline overrides), RIGHT is the new a28 rule (64px min, 48px img) */
</style></head><body>
<script>
const T=(z,e,c)=>'<div class="dbtags-ac-gtile"><img alt="" style="background:repeating-linear-gradient(45deg,#333,#333 10px,#3a3a3a 10px,#3a3a3a 20px);border-radius:4px"><span class="dbtags-ac-gtile-zh">'+z+'</span><span class="dbtags-ac-gtile-en">'+e+'</span><span class="dbtags-ac-gtile-cnt">'+c+'</span></div>';
const emo=["贴纸腮红","全脸红晕","鼻梁红晕","愤怒青筋","害　羞","怒视","皱眉","交叉腿","盘腿坐","莲花坐"],
      eng=["blush_sticker…","full_face_blus…","nose_blush","anger_vein","embarrassed","glaring","scowl","crossed_legs","indian_sit","lotus_position"],
      cnts=["156K","30.4K","147K","80.0K","140K","12.3K","6.4K","105K","20.9K","177"];
const tools='<div class="dbtags-ac-gtools"><input class="dbtags-ac-gfilter" placeholder="组内过滤(中/英)，如: 裙 / dress"><button class="dbtags-ac-gtoolbtn">收起全部</button><button class="dbtags-ac-gtoolbtn">展开全部</button></div>';
function hud(label,old){
  const b=document.createElement("div");b.style.width="441px";
  b.innerHTML='<div class="dv">'+label+'</div>'+
  '<div class="dbtags-ac-hud" style="--dbtags-ac-font:16px;position:relative;z-index:auto;max-width:none;max-height:none;width:441px;height:520px;resize:none">'+
   '<div class="dbtags-ac-hud-head"><span class="dbtags-ac-hud-title">姿态 (posture)</span><span class="dbtags-ac-hud-count">212</span></div>'+
   '<div class="dbtags-ac-hud-body">'+tools+'<div class="dbtags-ac-gscroll">'+sec("基本体位","Basic positions",10,"32")+'</div></div>'+
  '</div>';
  document.body.append(b);
  if (old) b.querySelectorAll('.dbtags-ac-gtiles').forEach(t=>t.style.gridTemplateColumns='repeat(auto-fill,minmax(72px,1fr))');
  if (old) b.querySelectorAll('.dbtags-ac-gtile img').forEach(i=>{i.style.height='64px';});
  return b;
}
function sec(t,en,n,cnt){return '<div class="dbtags-ac-gsec"><div class="dbtags-ac-gsec-head"><span class="dbtags-ac-gsec-caret">▾</span><span class="dbtags-ac-gsec-title">'+t+'</span><span class="dbtags-ac-gsec-en"> '+en+'</span><span class="dbtags-ac-gsec-count">'+cnt+'</span></div><div class="dbtags-ac-gtiles">'+
  Array.from({length:n},(_,i)=>T(emo[i%emo.length],eng[i%eng.length],cnts[i%cnts.length])).join("")+'</div></div>';}
hud("LEFT a27 现状 (72px min / 64px img) - simulate", true);
hud("RIGHT a28 fix33 (64px min / 48px img) - new", false);
</script>
</body></html>
