<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../web/js/dbtags_autocomplete.css">
<style>
  body{background:#242424;padding:14px;margin:0;display:flex;gap:22px;align-items:flex-start;}
  .dv{color:#8cf;font:11px monospace;margin:0 0 4px;}
  .dbtags-ac-styler-row{display:flex;align-items:center;gap:8px;}
  .dbtags-ac-styler-label{flex:0 0 132px;display:flex;}
  select, input[type=checkbox]{accent-color:#6aa;}
</style></head><body>
<script>
const lab=(t)=>'<div class="dbtags-ac-styler-label">'+t+'</div>';
const bool=(t,ck)=>'<div class="dbtags-ac-styler-row">'+lab(t)+'<input type="checkbox"'+(ck?" checked":"")+'></div>';
const combo=(t,v)=>'<div class="dbtags-ac-styler-row">'+lab(t)+'<select><option>'+v+'</option></select></div>';
const fold=(open)=>'<details class="dbtags-ac-styler-fold"'+(open?" open":"")+'><summary>悬停预览</summary>'+
  bool("显示预览图",1)+combo("预览图尺寸","小图（秒出）")+bool("显示文字摘要",1)+'</details>';
const wikicard=(foldopen)=>'<div style="width:430px;background:var(--dbtags-ac-bg);border:1px solid var(--dbtags-ac-border);border-radius:8px;padding:10px">'+
  '<div class="dv" style="color:#5a5;font:11px monospace;margin:0 0 8px;">wiki 面板（卡片）</div><div class="dbtags-ac-styler-subgroup">'+
  bool("wiki 正文",1)+bool("示例图",1)+combo("示例图尺寸","大图")+fold(foldopen)+bool("跳转胶囊",1)+
  '</div></div>';
const d1=document.createElement("div");d1.innerHTML='<div class="dv">折叠态</div>'+wikicard(0);document.body.append(d1);
const d2=document.createElement("div");d2.innerHTML='<div class="dv">展开态</div>'+wikicard(1);document.body.append(d2);
</script>
</body></html>
